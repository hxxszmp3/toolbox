      { name:'飞鼠格式转换助手', desc:'音视频 / 文档格式转换', quark:'https://pan.quark.cn/s/54d36d2d91dd', baidu:'https://pan.baidu.com/s/1g-EPPoxSKZJQIuzRqfdXvA?pwd=61xj' },
      { name:'AI视频无痕去字幕', desc:'AI 去除视频字幕', quark:'https://pan.quark.cn/s/4059abee799d', baidu:'https://pan.baidu.com/s/1GdsTfpiBIgbrwP0y35Zk2A?pwd=7p7v' },

      { name:'Win自动更新关闭工具', desc:'关闭 Windows 自动更新', quark:'https://pan.quark.cn/s/a66636a1bc90', baidu:'https://pan.baidu.com/s/18PwazXQO1lrhh_GtQaX4ow?pwd=q4sy' },
    ]

];

/* ===================== 渲染 ===================== */
const app = document.getElementById('app');
const sidebarNav = document.getElementById('sidebarNav');
const content = document.getElementById('content');
const topbarTitle = document.getElementById('topbarTitle');
const searchInput = document.getElementById('search');
let currentId = SECTIONS[0].id;

function renderNav(){
  sidebarNav.innerHTML = SECTIONS.map(s => `
    <button class="nav-item" data-id="${s.id}">
      <span class="nav-icon">${s.icon}</span>
      <span>${s.name}</span>
      <span class="nav-count">${s.tools.length}</span>
    </button>`).join('');
}

function toolCard(t, s){
  const tag = t.tag ? `<span class="tool-tag">${t.tag}</span>` : '';
  const baidu = t.baidu
    ? `<a class="btn btn-baidu" href="${t.baidu}" target="_blank" rel="noopener">备用下载</a>`
    : '';
  return `<div class="tool" style="--accent:${s.color};--accent-soft:${s.soft};--accent-border:${s.color}55">
    <div class="tool-accent"></div>
    <div class="tool-head">
      <span class="tool-icon">${s.icon}</span>
      <span class="tool-name">${t.name}</span>
      ${tag}
    </div>
    <div class="tool-desc">${t.desc}</div>
    <div class="tool-btns">
      <a class="btn btn-quark" href="${t.quark}" target="_blank" rel="noopener">点击下载</a>
      ${baidu}
    </div>
  </div>`;
}

function renderGrid(list, s){
  if (!list.length) return `<div class="no-result show"><div class="big">🔍</div>没有匹配的工具</div>`;
  return `<div class="grid">${list.map(t => toolCard(t, s)).join('')}</div>`;
}

function setActiveNav(id){
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
}

function renderSection(id){
  const s = SECTIONS.find(x => x.id === id);
  topbarTitle.textContent = s.name;
  setActiveNav(id);
  content.innerHTML = `
    <div class="section-head">
      <div class="section-icon" style="background:${s.soft}">${s.icon}</div>
      <div>
        <div class="section-title">${s.name}</div>
        <div class="section-count">共 ${s.tools.length} 款工具</div>
      </div>
    </div>
    <div class="section-desc">${s.desc}</div>
    ${renderGrid(s.tools, s)}`;
}

function renderSearch(q){
  topbarTitle.textContent = '搜索结果';
  setActiveNav('');
  const groups = [];
  SECTIONS.forEach(s => {
    const nameHit = s.name.toLowerCase().includes(q);
    const matched = nameHit ? s.tools : s.tools.filter(t => (t.name + t.desc).toLowerCase().includes(q));
    if (matched.length) groups.push({ s, tools: matched });
  });
  if (!groups.length){
    content.innerHTML = `<div class="no-result show"><div class="big">🔍</div>没有找到「${searchInput.value.trim()}」相关工具</div>`;
    return;
  }
  content.innerHTML = groups.map(g => `
    <div class="search-group">
      <div class="search-group-head">
        <span class="sg-icon" style="background:${g.s.soft}">${g.s.icon}</span>
        <span class="sg-name">${g.s.name}</span>
        <span class="sg-count">${g.tools.length} 款</span>
      </div>
      ${renderGrid(g.tools, g.s)}
    </div>`).join('');
}

/* ===================== 交互 ===================== */
sidebarNav.addEventListener('click', e => {
  const btn = e.target.closest('.nav-item');
  if (!btn) return;
  currentId = btn.dataset.id;
  searchInput.value = '';
  renderSection(currentId);
  // 移动端选中后关闭抽屉
  if (window.innerWidth < 768) app.classList.remove('sidebar-open');
});

// 全局搜索
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q) renderSearch(q);
  else renderSection(currentId);
});

// 侧栏开关（仅移动端抽屉）
document.getElementById('menuBtn').addEventListener('click', () => app.classList.toggle('sidebar-open'));
document.getElementById('backdrop').addEventListener('click', () => app.classList.remove('sidebar-open'));

renderNav();
renderSection(currentId);
</script>
</body>
</html>
