<script>
const PAGE_SIZE = 10;
const FAV_KEY = 'ldgj_favs';

/* ===================== 收藏（localStorage 持久化） ===================== */
let favs;
try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch(e){ favs = new Set(); }
const favKey = (s, t) => s.id + '::' + t.name;
const saveFavs = () => { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch(e){} };

/* ===================== 渲染 ===================== */
const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');
const searchInput = document.getElementById('search');
let currentId = SECTIONS[0].id;
let currentPage = 1;

/* hash 路由：#分区id 直达，支持刷新保持 / 分享链接 / 浏览器返回键 */
function hashSection(){
  const h = location.hash.slice(1);
  if (h === 'fav') return 'fav';
  return SECTIONS.some(s => s.id === h) ? h : SECTIONS[0].id;
}
function setHash(id){
  try { if (location.hash.slice(1) !== id) history.pushState(null, '', '#' + id); }
  catch(e){ location.hash = id; }
}

function renderTabs(){
  tabbar.innerHTML = SECTIONS.map(s => `
    <button class="tab" data-id="${s.id}">
      <span class="tab-icon">${s.icon}</span>
      <span>${s.name}</span>
      <span class="tab-count">${s.tools.length}</span>
    </button>`).join('') + `
    <button class="tab" data-id="fav">
      <span class="tab-icon">⭐</span>
      <span>我的收藏</span>
      <span class="tab-count">${favs.size}</span>
    </button>`;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 搜索命中高亮（先转义再包 mark，防注入） */
function hi(text, q){
  text = String(text);
  if (!q) return esc(text);
  const lower = text.toLowerCase();
  let out = '', i = 0;
  for(;;){
    const idx = lower.indexOf(q, i);
    if (idx < 0){ out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out;
}

/* 工具可搜索文本：名称 + 描述 + 标签 + 要点(去HTML) + 指令 + 网址 */
function toolText(t){
  const pts = (t.points || []).map(p => p.replace(/<[^>]+>/g, ' ')).join(' ');
  return (t.name + ' ' + t.desc + ' ' + (t.tag || '') + ' ' + pts + ' ' + (t.cmd || '') + ' ' + (t.web || '')).toLowerCase();
}

function toolCard(t, s, q = ''){
  const tag = t.tag ? `<span class="tool-tag">${esc(t.tag)}</span>` : '';
  const favOn = favs.has(favKey(s, t));
  const icon = t.img
    ? `<img class="tool-icon tool-img" src="${t.img}" alt="${esc(t.name)}" loading="lazy">`
    : `<span class="tool-icon">${t.emoji || s.icon}</span>`;

  let action = '';
  if (t.web){
    action = `<a class="web-link" href="${t.web}" target="_blank" rel="noopener">🔗 ${esc(t.web)}</a>`;
  } else if (t.cmd){
    action = `<div class="cmd-wrap"><div class="cmd-hint">怎么安装：复制以下代码到 agent 即可</div><div class="cmd-row"><code>${esc(t.cmd)}</code><button class="btn-copy" data-copy="${esc(t.cmd)}">复制</button></div></div>`;
  } else if (t.quark){
    const baidu = t.baidu ? `<a class="btn btn-baidu" href="${t.baidu}" target="_blank" rel="noopener">备用下载</a>` : '';
    action = `<div class="tool-btns"><a class="btn btn-quark" href="${t.quark}" target="_blank" rel="noopener">点击下载</a>${baidu}</div>`;
  }

  const points = t.points ? `<ul class="tool-points">${t.points.map(p => `<li>${p}</li>`).join('')}</ul>` : '';

  return `<div class="tool" style="--accent:${s.color};--accent-soft:${s.soft};--accent-border:${s.color}99">
    <div class="tool-accent"></div>
    <button class="fav-btn${favOn ? ' on' : ''}" data-fav="${favKey(s, t)}" title="${favOn ? '取消收藏' : '收藏'}">★</button>
    <div class="tool-head">
      ${icon}
      <span class="tool-name">${hi(t.name, q)}</span>
      ${tag}
    </div>
    <div class="tool-desc">${hi(t.desc, q)}</div>
    ${points}
    ${action ? `<div class="tool-action">${action}</div>` : ''}
  </div>`;
}

function renderGrid(list, s, q = ''){
  if (!list.length) return `<div class="no-result show"><div class="big">🔍</div>没有匹配的工具</div>`;
  return `<div class="grid">${list.map(t => toolCard(t, s, q)).join('')}</div>`;
}

function paginationHTML(totalPages, page){
  if (totalPages <= 1) return '';
  let nums = '';
  for (let i = 1; i <= totalPages; i++){
    nums += `<button class="page-btn ${i===page?'active':''}" data-page="${i}">${i}</button>`;
  }
  return `<div class="pagination">
    <button class="page-btn" data-page="${page-1}" ${page===1?'disabled':''}>上一页</button>
    ${nums}
    <button class="page-btn" data-page="${page+1}" ${page===totalPages?'disabled':''}>下一页</button>
  </div>`;
}

function setActiveTab(id){
  document.querySelectorAll('.tab').forEach(el => {
    const on = el.dataset.id === id;
    el.classList.toggle('active', on);
    if (on) el.scrollIntoView({ block:'nearest', inline:'nearest' });
  });
}

function renderFavorites(){
  setActiveTab('fav');
  const items = [];
  SECTIONS.forEach(s => s.tools.forEach(t => { if (favs.has(favKey(s, t))) items.push({ t, s }); }));
  if (!items.length){
    content.innerHTML = `<div class="no-result show"><div class="big">⭐</div>还没有收藏的工具<br>点击卡片右上角的 ★，就能把常用工具收在这里</div>`;
    return;
  }
  content.innerHTML = `<div class="grid">${items.map(({ t, s }) => toolCard(t, s)).join('')}</div>`;
}

function renderSection(id, page = 1, opts = {}){
  const scroll = opts.scroll !== false;
  if (id === 'fav'){
    currentId = 'fav';
    setHash('fav');
    renderFavorites();
    if (scroll) window.scrollTo({ top:0, behavior:'smooth' });
    return;
  }
  const s = SECTIONS.find(x => x.id === id);
  if (!s) return renderSection(SECTIONS[0].id, page, opts);
  currentId = id;
  const totalPages = Math.max(1, Math.ceil(s.tools.length / PAGE_SIZE));
  currentPage = Math.min(page, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const list = s.tools.slice(start, start + PAGE_SIZE);
  setActiveTab(id);
  content.innerHTML = `${renderGrid(list, s)}${paginationHTML(totalPages, currentPage)}<div class="section-update">🔄 持续更新中，更多工具敬请期待…</div>`;
  setHash(id);
  if (scroll) window.scrollTo({ top:0, behavior:'smooth' });
}

function renderSearch(q){
  setActiveTab('');
  const groups = [];
  SECTIONS.forEach(s => {
    const nameHit = s.name.toLowerCase().includes(q);
    const matched = nameHit ? s.tools : s.tools.filter(t => toolText(t).includes(q));
    if (matched.length) groups.push({ s, tools: matched });
  });
  if (!groups.length){
    content.innerHTML = `<div class="no-result show"><div class="big">🔍</div>没有找到「${esc(searchInput.value.trim())}」相关工具</div>`;
    return;
  }
  content.innerHTML = groups.map(g => `
    <div class="search-group">
      <div class="search-group-head">
        <span class="sg-icon" style="background:${g.s.soft}">${g.s.icon}</span>
        <span class="sg-name">${g.s.name}</span>
        <span class="sg-count">${g.tools.length} 款</span>
      </div>
      ${renderGrid(g.tools, g.s, q)}
    </div>`).join('');
}

/* ===================== 交互 ===================== */
// 切换分区
tabbar.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  searchInput.value = '';
  renderSection(btn.dataset.id, 1);
});

// 分页点击 / 收藏 / 复制
content.addEventListener('click', e => {
  const pageBtn = e.target.closest('.page-btn');
  if (pageBtn && !pageBtn.disabled){
    renderSection(currentId, parseInt(pageBtn.dataset.page, 10));
    return;
  }
  const favBtn = e.target.closest('.fav-btn');
  if (favBtn){
    const key = favBtn.dataset.fav;
    if (favs.has(key)) favs.delete(key); else favs.add(key);
    saveFavs();
    renderTabs();
    renderSection(currentId, currentPage, { scroll:false });
    return;
  }
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn){
    const cmd = copyBtn.dataset.copy;
    const done = () => { copyBtn.textContent = '已复制'; setTimeout(() => copyBtn.textContent = '复制', 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(cmd).then(done).catch(() => fallbackCopy(cmd, done));
    } else fallbackCopy(cmd, done);
  }
});

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}

// 全局搜索（150ms 防抖；清空后回到 hash 对应分区）
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = searchInput.value.trim().toLowerCase();
    if (q) renderSearch(q);
    else renderSection(hashSection(), 1, { scroll:false });
  }, 150);
});

// 浏览器前进/后退（hash 路由）
window.addEventListener('hashchange', () => {
  if (searchInput.value.trim()) return;
  renderSection(hashSection(), 1);
});

// 回到顶部
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => {
  backTop.classList.toggle('show', window.scrollY > 400);
});
backTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

renderTabs();
renderSection(hashSection(), 1, { scroll:false });
</script>
