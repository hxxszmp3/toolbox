const PAGE_SIZE = 10;

/* ===================== 渲染 ===================== */
const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');
const searchInput = document.getElementById('search');
let currentId = SECTIONS[0].id;
let currentPage = 1;

function renderTabs(){
  tabbar.innerHTML = SECTIONS.map(s => `
    <button class="tab" data-id="${s.id}">
      <span class="tab-icon">${s.icon}</span>
      <span>${s.name}</span>
      <span class="tab-count">${s.tools.length}</span>
    </button>`).join('');
}

function toolCard(t, s){
  const tag = t.tag ? `<span class="tool-tag">${t.tag}</span>` : '';
  const icon = t.img
    ? `<img class="tool-icon tool-img" src="${t.img}" alt="${t.name}" loading="lazy">`
    : `<span class="tool-icon">${t.emoji || s.icon}</span>`;

  let action = '';
  if (t.web){
    action = `<a class="web-link" href="${t.web}" target="_blank" rel="noopener">🔗 ${t.web}</a>`;
  } else if (t.cmd){
    action = `<div class="cmd-row"><code>${t.cmd}</code><button class="btn-copy" data-cmd="${t.cmd}">复制</button></div>`;
  } else if (t.quark){
    const baidu = t.baidu
      ? `<a class="btn btn-baidu" href="${t.baidu}" target="_blank" rel="noopener">备用下载</a>`
      : '';
    action = `<div class="tool-btns">
      <a class="btn btn-quark" href="${t.quark}" target="_blank" rel="noopener">点击下载</a>
      ${baidu}
    </div>`;
  }

  return `<div class="tool" style="--accent:${s.color};--accent-soft:${s.soft};--accent-border:${s.color}99">
    <div class="tool-accent"></div>
    <div class="tool-head">
      ${icon}
      <span class="tool-name">${t.name}</span>
      ${tag}
    </div>
    <div class="tool-desc">${t.desc}</div>
    ${action}
  </div>`;
}

function renderGrid(list, s){
  if (!list.length) return `<div class="no-result show"><div class="big">🔍</div>没有匹配的工具</div>`;
  return `<div class="grid">${list.map(t => toolCard(t, s)).join('')}</div>`;
}

function paginationHTML(totalPages, page){
  if (totalPages <= 1) return '';
  let nums = '';
  for (let i = 1; i <= totalPages; i++){
    nums += `<button class="page-btn ${i===page?'active':''}" data-page="${i}">${i}</button>`;
  }
  return `<div class="pagination">
    <button class="page-btn" data-page="${page-1}" ${page===1?'disabled':''}>上一页</button>
    ${nums}
    <button class="page-btn" data-page="${page+1}" ${page===totalPages?'disabled':''}>下一页</button>
  </div>`;
}

function setActiveTab(id){
  document.querySelectorAll('.tab').forEach(el => {
    const on = el.dataset.id === id;
    el.classList.toggle('active', on);
    if (on) el.scrollIntoView({ block:'nearest', inline:'nearest' });
  });
}

function renderSection(id, page=1){
  currentId = id;
  const s = SECTIONS.find(x => x.id === id);
  const totalPages = Math.max(1, Math.ceil(s.tools.length / PAGE_SIZE));
  currentPage = Math.min(page, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const list = s.tools.slice(start, start + PAGE_SIZE);
  setActiveTab(id);
  content.innerHTML = `${renderGrid(list, s)}${paginationHTML(totalPages, currentPage)}<div class="section-update">🔄 持续更新中，更多工具敬请期待…</div>`;
}

function renderSearch(q){
  setActiveTab('');
  const groups = [];
  SECTIONS.forEach(s => {
    const nameHit = s.name.toLowerCase().includes(q);
    const matched = nameHit ? s.tools : s.tools.filter(t => (t.name + t.desc).toLowerCase().includes(q));
    if (matched.length) groups.push({ s, tools: matched });
  });
  if (!groups.length){
    content.innerHTML = `<div class="no-result show"><div class="big">🔍</div>没有找到「${searchInput.value.trim()}」相关工具</div>`;
    return;
  }
  content.innerHTML = groups.map(g => `
    <div class="search-group">
      <div class="search-group-head">
        <span class="sg-icon" style="background:${g.s.soft}">${g.s.icon}</span>
        <span class="sg-name">${g.s.name}</span>
        <span class="sg-count">${g.tools.length} 款</span>
      </div>
      ${renderGrid(g.tools, g.s)}
    </div>`).join('');
}

/* ===================== 交互 ===================== */
// 切换分区
tabbar.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  searchInput.value = '';
  renderSection(btn.dataset.id, 1);
});

// 分页点击 + 复制指令
content.addEventListener('click', e => {
  const pageBtn = e.target.closest('.page-btn');
  if (pageBtn && !pageBtn.disabled){
    renderSection(currentId, parseInt(pageBtn.dataset.page, 10));
    return;
  }
  const copyBtn = e.target.closest('.btn-copy');
  if (copyBtn){
    const cmd = copyBtn.dataset.cmd;
    const done = () => { copyBtn.textContent = '已复制'; setTimeout(() => copyBtn.textContent = '复制', 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(cmd).then(done).catch(() => fallbackCopy(cmd, done));
    } else fallbackCopy(cmd, done);
  }
});

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}

// 全局搜索
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q) renderSearch(q);
  else renderSection(currentId, 1);
});

// 回到顶部
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => {
  backTop.classList.toggle('show', window.scrollY > 400);
});
backTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

renderTabs();
renderSection(currentId, 1);
</script>
