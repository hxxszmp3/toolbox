<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 - 来点工具</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--border:#e8ebf0;--text:#1a1d24;--text-2:#5b6472;--text-3:#9aa3b2;--primary:#2563eb;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1216;--card:#171b21;--border:#272d36;--text:#e6eaf0;--text-2:#a3adbb;--text-3:#667080;--primary:#3b82f6}
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{text-align:center;max-width:520px;width:100%}
.big{font-size:88px;line-height:1.2}
h1{font-size:22px;margin:14px 0 8px}
p{font-size:14px;color:var(--text-2);margin-bottom:26px}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.links a{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--text-2);text-decoration:none;transition:all .15s}
.links a:hover{border-color:var(--primary);color:var(--primary)}
.links a.main{background:var(--primary);color:#fff;border-color:var(--primary)}
.links a.main:hover{opacity:.9;color:#fff}
.copy{margin-top:30px;font-size:12px;color:var(--text-3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="big">🔧</div>
  <h1>这个页面不见了</h1>
  <p>链接可能输错了，或者页面被移走了。回首页继续逛逛吧～</p>
  <div class="links">
    <a class="main" href="/">← 回首页</a>
    <a href="/#software">实用软件</a>
    <a href="/#novel">小说专区</a>
    <a href="/#ai">AI 专区</a>
  </div>
  <div class="copy">来点工具 · ldgj.xyz</div>
</div>
</body>
</html>
